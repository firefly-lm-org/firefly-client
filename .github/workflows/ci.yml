name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: |
          python -c "from firefly.core.client import FireflyClient; print('Client OK')"
          python -c "from firefly.core.hardware import detect_hardware; print(detect_hardware())"
      - name: Lint
        run: pip install ruff && ruff check firefly/ --ignore E501 || true
