name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Diagnose environment
        run: |
          echo "=== Environment ==="
          python --version
          pip --version
          echo "=== Files ==="
          ls -la
          echo "=== requirements.txt ==="
          cat requirements.txt || echo "(not found)"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install --no-deps -r requirements.txt || true

      - name: Unit tests
        run: |
          python -c "from firefly.core.client import FireflyClient; print('Client OK')" || echo "client import failed"
          python -c "from firefly.core.hardware import detect_hardware; print(detect_hardware())" || echo "hardware import failed"

      - name: Lint
        run: pip install ruff && ruff check firefly/ --ignore E501 || true
