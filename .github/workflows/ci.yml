name: CI · Firefly Client

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install core deps
        run: |
          pip install -r requirements.txt torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: |
          python -c "from firefly.core.client import FireflyClient; print('OK')"
          python -c "from firefly.core.hardware import detect_hardware; print(detect_hardware())"
      - name: Lint
        run: pip install ruff && ruff check firefly/ --ignore E501